spring.application.name=damagecalc
spring.threads.virtual.enabled=true
vgcenter.dataset.root=classpath:data
vgcenter.dataset.schema-root=classpath:data/schema
# Comma-separated list for deployed frontend origins, e.g. https://calc.example.com
# vgcenter.cors.allowed-origins=
management.endpoints.web.exposure.include=health
server.tomcat.max-http-form-post-size=64KB
server.tomcat.max-swallow-size=64KB
spring.servlet.multipart.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
